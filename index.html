<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Map</title>
    
    <!-- ArcGIS Maps SDK for JavaScript -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.28/"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Green banner with dropdown -->
    <div id="banner">
        <div class="dropdown">
            <button class="dropdown-button" onclick="toggleDropdown()">Layers</button>
            <div class="dropdown-content" id="layerDropdown">
                <div class="layer-item" onclick="toggleLayer('aoi', event)">
                    <input type="checkbox" id="aoiCheck" checked>
                    <label for="aoiCheck">Areas of Interest</label>
                </div>
                <!-- <div class="layer-item" onclick="toggleLayer('progress', event)">
                    <input type="checkbox" id="progressCheck" checked>
                    <label for="progressCheck">In Progress</label>
                </div> -->
                <div class="layer-item" onclick="toggleLayer('counties', event)">
                    <input type="checkbox" id="countiesCheck">
                    <label for="countiesCheck">Counties</label>
                </div>
            </div>
        </div>
        <div class="dropdown" style="margin-left: 15px;">
            <button class="dropdown-button" onclick="toggleStateDropdown()">State of Interest</button>
            <div class="dropdown-content" id="stateDropdown">
                <div class="layer-item" onclick="filterByState('AZ', event)">
                    <input type="checkbox" id="stateAZ">
                    <label for="stateAZ">Arizona</label>
                </div>
                <div class="layer-item" onclick="filterByState('CA', event)">
                    <input type="checkbox" id="stateCA">
                    <label for="stateCA">California</label>
                </div>
                <div class="layer-item" onclick="filterByState('TX', event)">
                    <input type="checkbox" id="stateTX">
                    <label for="stateTX">Texas</label>
                </div>
            </div>
        </div>
        <div class="dropdown" style="margin-left: 15px;">
            <button class="dropdown-button" onclick="toggleSelectorPane()">Selector</button>
        </div>
    </div>

    <!-- Selector Pane -->
    <div id="selectorPane">
        <div class="pane-header">ZIP Code Selector</div>
        <div class="pane-content">
            <div class="mode-buttons">
                <button class="mode-btn active" id="pointModeBtn" onclick="setSelectionMode('point')">Point</button>
                <button class="mode-btn" id="lassoModeBtn" onclick="setSelectionMode('lasso')">Lasso</button>
            </div>
            <div class="selection-count" id="selectionCount">Selected: 0 zip codes</div>
            <div class="zipcode-list" id="zipcodeList">
                <div style="color: #999; text-align: center; padding: 20px;">Hold Ctrl + Click on map to select zip codes</div>
            </div>
            <div class="action-buttons">
                <button class="action-btn clear-btn" onclick="clearSelection()">Clear Selection</button>
                <button class="action-btn export-btn" onclick="exportToCSV()">Export List (CSV)</button>
            </div>
        </div>
    </div>

    <!-- Map container -->
    <div id="viewDiv"></div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
